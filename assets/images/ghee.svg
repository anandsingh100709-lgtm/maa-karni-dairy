<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="gheeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>
    <linearGradient id="liquidGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="gShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#78350F" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#gheeBg)" />
  <circle cx="200" cy="150" r="105" fill="#FFFFFF" fill-opacity="0.75" />

  <!-- Traditional Golden Ghee Pot & Spoon -->
  <g transform="translate(130, 50)" filter="url(#gShadow)">
    <!-- Jar/Pot Body -->
    <path d="M40 70 L40 185 C40 205 60 220 75 220 C90 220 110 205 110 185 L110 70 Z" fill="url(#liquidGold)" stroke="#B45309" stroke-width="2"/>
    <!-- Lid / Rim -->
    <rect x="30" y="55" width="90" height="15" rx="5" fill="#D97706" />
    <rect x="45" y="42" width="60" height="13" rx="4" fill="#B45309" />
    <circle cx="75" cy="38" r="8" fill="#F59E0B" />
    <!-- Glass/Surface highlights -->
    <path d="M48 85 L48 180" stroke="#FEF08A" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M102 85 L102 180" stroke="#FEF08A" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    
    <!-- Traditional Brass Spoon Dipping in Ghee -->
    <g transform="translate(45, 10)">
      <path d="M75 10 L105 105 C107 109 113 111 118 107 L122 103 C125 99 123 93 119 90 L90 10 Z" fill="#CA8A04" />
      <ellipse cx="112" cy="100" rx="10" ry="7" fill="#F59E0B" />
      <!-- Golden Ghee Drop falling -->
      <circle cx="106" cy="122" r="3.5" fill="#F59E0B" />
      <circle cx="104" cy="135" r="2.5" fill="#F59E0B" />
    </g>

    <!-- Golden Label -->
    <rect x="48" y="120" width="54" height="42" rx="6" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5"/>
    <text x="75" y="137" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#92400E" text-anchor="middle">DESI GHEE</text>
    <text x="75" y="152" font-family="'Mukta', sans-serif" font-size="10" font-weight="600" fill="#B45309" text-anchor="middle">दानेदार व शुद्ध</text>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(20, 20)">
    <rect width="130" height="30" rx="15" fill="#B45309" />
    <text x="65" y="20" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">100% DESI GHEE</text>
  </g>
</svg>
