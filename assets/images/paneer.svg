<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="paneerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4" />
      <stop offset="100%" stop-color="#DCFCE7" />
    </linearGradient>
    <linearGradient id="cubeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="pnrShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#14532D" flood-opacity="0.13" />
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#paneerBg)" />
  <circle cx="200" cy="150" r="105" fill="#FFFFFF" fill-opacity="0.75" />

  <!-- Wooden Platter with Fresh Paneer Cubes -->
  <g transform="translate(110, 65)" filter="url(#pnrShadow)">
    <!-- Wooden Platter Base -->
    <ellipse cx="90" cy="150" rx="90" ry="24" fill="#D97706" opacity="0.3" />
    <ellipse cx="90" cy="144" rx="85" ry="20" fill="#FEF3C7" stroke="#D97706" stroke-width="2" />
    <path d="M5 144 Q90 162 175 144" stroke="#B45309" stroke-width="1.5" fill="none" opacity="0.6" />

    <!-- Isometric Paneer Block (Center Back) -->
    <g transform="translate(50, 45)">
      <!-- Top Face -->
      <polygon points="40,10 75,25 40,40 5,25" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <!-- Left Face -->
      <polygon points="5,25 40,40 40,75 5,60" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <!-- Right Face -->
      <polygon points="40,40 75,25 75,60 40,75" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    </g>

    <!-- Paneer Cube 1 (Front Left) -->
    <g transform="translate(30, 85)">
      <polygon points="25,5 50,15 25,25 0,15" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <polygon points="0,15 25,25 25,48 0,38" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <polygon points="25,25 50,15 50,38 25,48" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    </g>

    <!-- Paneer Cube 2 (Front Right) -->
    <g transform="translate(85, 80)">
      <polygon points="28,5 55,16 28,27 0,16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" />
      <polygon points="0,16 28,27 28,52 0,41" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" />
      <polygon points="28,27 55,16 55,41 28,52" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1" />
    </g>

    <!-- Fresh Herb / Coriander Leaf Garnish -->
    <g transform="translate(68, 120)">
      <path d="M12 0 C18 6 16 16 10 20 C6 16 4 8 12 0 Z" fill="#16A34A" />
      <path d="M22 4 C26 12 20 20 12 20 C14 14 18 8 22 4 Z" fill="#22C55E" />
      <path d="M0 6 C6 10 6 18 10 20 C4 20 0 14 0 6 Z" fill="#15803D" />
    </g>
  </g>

  <!-- Tag Pill -->
  <g transform="translate(20, 20)">
    <rect width="130" height="30" rx="15" fill="#15803D" />
    <text x="65" y="20" font-family="'Poppins', sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">SOFT &amp; FRESH</text>
  </g>
</svg>
