<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="qrBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
  </defs>
  
  <rect width="280" height="280" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Outer Corner QR Position Markers -->
  <!-- Top-Left -->
  <rect x="25" y="25" width="60" height="60" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="6"/>
  <rect x="43" y="43" width="24" height="24" rx="4" fill="#15803D"/>
  
  <!-- Top-Right -->
  <rect x="195" y="25" width="60" height="60" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="6"/>
  <rect x="213" y="43" width="24" height="24" rx="4" fill="#15803D"/>
  
  <!-- Bottom-Left -->
  <rect x="25" y="195" width="60" height="60" rx="8" fill="#F0FDF4" stroke="#15803D" stroke-width="6"/>
  <rect x="43" y="213" width="24" height="24" rx="4" fill="#15803D"/>

  <!-- Decorative stylized pattern modules -->
  <rect x="100" y="30" width="16" height="16" rx="2" fill="#94A3B8"/>
  <rect x="125" y="30" width="16" height="16" rx="2" fill="#CBD5E1"/>
  <rect x="150" y="30" width="16" height="16" rx="2" fill="#94A3B8"/>
  <rect x="100" y="55" width="16" height="16" rx="2" fill="#CBD5E1"/>
  <rect x="150" y="55" width="16" height="16" rx="2" fill="#94A3B8"/>
  <rect x="30" y="100" width="16" height="16" rx="2" fill="#94A3B8"/>
  <rect x="55" y="100" width="16" height="16" rx="2" fill="#CBD5E1"/>
  <rect x="200" y="100" width="16" height="16" rx="2" fill="#94A3B8"/>
  <rect x="230" y="100" width="16" height="16" rx="2" fill="#CBD5E1"/>
  
  <!-- Center Placeholder Badge -->
  <rect x="75" y="85" width="130" height="110" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="140" cy="115" r="16" fill="#F59E0B"/>
  <!-- Scan Icon -->
  <path d="M134 110 L134 113 M146 110 L146 113 M134 120 L134 117 M146 120 L146 117 M132 115 L148 115" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <text x="140" y="145" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#92400E" text-anchor="middle">QR CODE</text>
  <text x="140" y="160" font-family="'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#B45309" text-anchor="middle">PLACEHOLDER</text>
  <text x="140" y="176" font-family="'Mukta', sans-serif" font-size="9" font-weight="600" fill="#78350F" text-anchor="middle">config.js में बदलें</text>
  
  <!-- Bottom QR bits -->
  <rect x="100" y="210" width="16" height="16" rx="2" fill="#94A3B8"/>
  <rect x="130" y="225" width="16" height="16" rx="2" fill="#CBD5E1"/>
  <rect x="160" y="210" width="16" height="16" rx="2" fill="#94A3B8"/>
  <rect x="210" y="210" width="16" height="16" rx="2" fill="#CBD5E1"/>
</svg>
